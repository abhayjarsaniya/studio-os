<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="40%" stop-color="#FBBF24" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="240" height="240" rx="48" fill="url(#darkBg)" />
  <rect width="234" height="234" x="3" y="3" rx="45" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.6" />

  <!-- Outer Aperture Ring -->
  <circle cx="120" cy="100" r="62" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.8" />
  <circle cx="120" cy="100" r="54" fill="#18181B" stroke="url(#goldGrad)" stroke-width="1.5" />

  <!-- Camera Aperture Blades (6-blade geometric shutter) -->
  <g stroke="url(#goldGrad)" stroke-width="2" fill="none" opacity="0.9">
    <path d="M120 46 L144 80" />
    <path d="M166 73 L152 112" />
    <path d="M166 127 L128 132" />
    <path d="M120 154 L96 120" />
    <path d="M74 127 L88 88" />
    <path d="M74 73 L112 68" />
  </g>

  <!-- Center Lens Core / Monogram Accent -->
  <circle cx="120" cy="100" r="24" fill="url(#darkBg)" stroke="url(#goldGrad)" stroke-width="2.5" />
  <circle cx="120" cy="100" r="14" fill="url(#goldGrad)" opacity="0.3" />
  <circle cx="120" cy="100" r="7" fill="url(#goldGrad)" />
  
  <!-- Subtle Flash / Star Accent -->
  <path d="M152 68 L155 74 L161 77 L155 80 L152 86 L149 80 L143 77 L149 74 Z" fill="url(#goldGrad)" />

  <!-- Brand Typography -->
  <text x="120" y="186" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="19" font-weight="900" fill="#F4F4F5" letter-spacing="3.5">
    SHREEJI
  </text>
  <text x="120" y="206" text-anchor="middle" font-family="'Montserrat', 'Inter', 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#F59E0B" letter-spacing="4">
    STUDIO
  </text>
  <line x1="60" y1="216" x2="180" y2="216" stroke="url(#goldGrad)" stroke-width="1" opacity="0.4" />
  <text x="120" y="226" text-anchor="middle" font-family="'Inter', sans-serif" font-size="6.5" font-weight="600" fill="#71717A" letter-spacing="2">
    PHOTO &amp; CINEMA
  </text>
</svg>
