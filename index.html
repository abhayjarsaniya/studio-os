    <title>Studio OS – Studio Operating System</title>
    <!-- iOS Safari & Storage Safeguard + Stale Service Worker Unregistration -->
    <script>
      (function() {
        try {
          var testKey = '__studio_os_storage_test__';
          window.localStorage.setItem(testKey, testKey);
          window.localStorage.removeItem(testKey);
        } catch (e) {
          var memoryStore = {};
          try {
            Object.defineProperty(window, 'localStorage', {
              value: {
                getItem: function(key) { return memoryStore[key] || null; },
                setItem: function(key, val) { memoryStore[key] = String(val); },
                removeItem: function(key) { delete memoryStore[key]; },
                clear: function() { memoryStore = {}; },
                key: function(idx) { return Object.keys(memoryStore)[idx] || null; },
                get length() { return Object.keys(memoryStore).length; }
              },
              configurable: true,
              enumerable: true,
              writable: true
            });
          } catch (e2) {}
        }
        // Unregister any stale legacy service workers
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            for (var i = 0; i < regs.length; i++) {
              regs[i].unregister();
            }
          }).catch(function() {});
        }
      })();
    </script>
